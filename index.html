<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 06 - Q2 Console Output</title>
</head>
<body>
    <h2>Check your Browser Console (F12 or Inspect -> Console)</h2>

    <script>
        // Inline JSON data representing the collection
        const libraryData = {
          "books": [
            {
              "title": "The Great Gatsby",
              "author": "F. Scott Fitzgerald",
              "publicationYear": 1925,
              "genres": ["Fiction", "Classics"]
            },
            {
              "title": "To Kill a Mockingbird",
              "author": "Harper Lee",
              "publicationYear": 1960,
              "genres": ["Fiction", "Coming-of-Age"]
            }
          ]
        };

        // 1. The title of the first book
        console.log("Title of the first book:", libraryData.books[0].title);

        // 2. The author of the second book
        console.log("Author of the second book:", libraryData.books[1].author);

        // 3. The genres of all books
        console.log("Genres of all books:");
        libraryData.books.forEach((book, index) => {
            console.log(`- Book ${index + 1} (${book.title}):`, book.genres.join(", "));
        });
    </script>
</body>
</html>
